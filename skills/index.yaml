    description: "Construye un framework de 4 niveles de progresión profesional para cualquier rol con descripciones de comportamiento por nivel. Incluye 'What this level is NOT' para evitar grade inflation y matriz resumen."
    pattern: sequential-workflow
    category: document-creation
    tags: [hr, career-ladder, performance, roles, promoción, comportamiento, equidad]
    instructions: skills/career-ladder-builder/instructions.md

  - id: campaign-retrospective-builder
    name: "Campaign Retrospective Builder"
    description: "Facilita retrospectivas de campañas de marketing con análisis de causa raíz (5 Whys) por canal/creatividad/audiencia. Entrega: qué matar, qué mantener, qué escalar y 3 hipótesis para la siguiente iteración."
    pattern: sequential-workflow
    category: document-creation
    tags: [marketing, retrospectiva, campañas, análisis, 5-whys, hipótesis, roi]
