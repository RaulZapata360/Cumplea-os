    description: "Genera SVG técnico usando fórmulas matemáticas y patterns repetitivos en lugar de coordenadas hardcodeadas. Ideal para sombreado de materiales (concreto, suelo, acero), acero de refuerzo, capas de suelo y cualquier elemento que se repite con lógica geométrica. Triggers: 'genera el patrón de refuerzo', 'sombrea el concreto', 'dibuja las barras de acero', 'perfil de terreno', 'textura de material'."
    pattern: sequential-workflow
    category: document-creation
    tags: [svg, algoritmos, patrones, matemáticas, generativo, escala, CAD, refuerzo, materiales]
    instructions: skills/algorithmic-art/instructions.md

