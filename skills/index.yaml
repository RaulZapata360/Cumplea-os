    category: document-creation
    tags: [mermaid, diagramas, flowchart, secuencia, entidad-relacion, arquitectura, visualización]
    instructions: skills/mermaid-expert/instructions.md

  - id: canvas-design
    name: "Canvas Design"
    description: "Diseña layouts SVG 2D técnicos con coordenadas precisas usando variables de escala, bounding boxes y grupos con transform. Resuelve el problema de coordenadas absolutas mal calculadas. Usar para planos, perfiles, cotas y cualquier layout técnico vectorial. Triggers: 'diseña un plano SVG', 'layout técnico', 'perfil transversal', 'sección con cotas', 'diagrama con medidas'."
    pattern: iterative-refinement
    category: document-creation
    tags: [svg, canvas, 2d, coordenadas, bounding-box, planos, cotas, vectorial, CAD]
    instructions: skills/canvas-design/instructions.md

