    name: "Web Artifacts Builder"
    description: "Genera SVG y componentes HTML/CSS semánticamente correctos con estructura de capas, defs, patterns y CSS embebido. Asegura que el SVG no se rompa al moverlo entre web, PDF o Notion. Usar cuando necesites SVG de producción limpio y portable. Triggers: 'genera el SVG completo', 'componente web limpio', 'artefacto interactivo', 'SVG para exportar'."
    pattern: sequential-workflow
    category: document-creation
    tags: [svg, html, css, semántica, defs, pattern, componentes, web, portable]
    instructions: skills/web-artifacts-builder/instructions.md

  - id: core-components
    name: "Core Components"
    description: "Construye bibliotecas de bloques CAD reutilizables en SVG usando symbol y use. Define apoyos, cimentaciones, perfiles estructurales y barras de refuerzo una vez y los instancia en cualquier posición y escala. Triggers: 'crea los bloques del plano', 'biblioteca de símbolos CAD', 'apoyo fijo SVG', 'perfil IPN en SVG', 'símbolo reutilizable'."
    pattern: domain-intelligence
    category: workflow-automation
    tags: [svg, CAD, symbol, use, bloques, reutilizable, biblioteca, estructural, planos]
    instructions: skills/core-components/instructions.md

  - id: svg-to-pdf
    name: "SVG to PDF"
    description: "Convierte SVG técnicos a PDF sin romper líneas, fuentes ni proporciones. Diagnostica y corrige los 5 problemas más comunes: fuentes sustituidas, líneas invisibles, coordenadas cortadas, fondo negro, gradientes rasterizados. Soporta cairosvg, Puppeteer e Inkscape CLI. Triggers: 'exporta el SVG a PDF', 'el PDF sale roto', 'las líneas desaparecen en PDF', 'fuente incorrecta en PDF'."
    pattern: sequential-workflow
    category: workflow-automation
    tags: [svg, pdf, conversión, vectorial, viewbox, fuentes, cairosvg, puppeteer, inkscape]
    instructions: skills/svg-to-pdf/instructions.md

  - id: ui-visual-validator
    name: "UI Visual Validator"
    description: "Audita SVG o componentes HTML/CSS antes de renderizar o exportar. Detecta stroke-width cero, coordenadas fuera del viewBox, IDs duplicados, referencias rotas a defs y fondo transparente. Entrega reporte con errores críticos, advertencias y acciones concretas. Triggers: 'valida el SVG', 'audita el componente', 'algo se ve mal', 'revisa antes de exportar', 'chequea el SVG'."
    pattern: sequential-workflow
    category: workflow-automation
    tags: [svg, validación, audit, ui, visual, errores, calidad, pre-export, diagnóstico]
    instructions: skills/ui-visual-validator/instructions.md


