# SKILLS INDEX — Nivel 1 (siempre en contexto)
# Lee solo este archivo primero.
# Si un skill parece relevante → carga instructions.md
# Si necesitas más detalle → carga la carpeta files/
#
# Patrones disponibles (ver skills/patterns.yaml):
#   sequential-workflow | multi-mcp-coordination | iterative-refinement
#   context-aware-branching | domain-intelligence
#
# Categorías disponibles (ver skills/categories.yaml):
#   document-creation | workflow-automation | mcp-enhancement

skills:

  - id: job-description-optimizer
    name: "Job Description Optimizer"
    description: "Audita y reescribe descripciones de empleo para atraer A-players. Detecta requirement inflation, salary opacity y buzzwords, luego reescribe con lenguaje de outcomes. Entrega: audit + JD reescrito + changelog."
    pattern: sequential-workflow
    category: document-creation
    tags: [hr, recruiting, job-description, hiring, talent, outcomes]
    instructions: skills/job-description-optimizer/instructions.md

  - id: metric-explainer
    name: "Metric Explainer"
    description: "Explica cualquier métrica financiera o SaaS en lenguaje simple con benchmarks por etapa, red flags, levers de mejora y veredicto (healthy/watch/concerning/critical) si el usuario provee su número."
    pattern: sequential-workflow
    category: document-creation
    tags: [métricas, finanzas, saas, kpi, benchmarks, cfo, análisis]
    instructions: skills/metric-explainer/instructions.md

  - id: sop-standardizer
    name: "SOP Standardizer"
    description: "Convierte notas sueltas, brain dumps o pasos en borrador en un SOP formal y ejecutable listo para wiki de empresa. Incluye quick reference de una página."
    pattern: sequential-workflow
    category: document-creation
    tags: [sop, documentación, operaciones, procesos, wiki, onboarding]
    instructions: skills/sop-standardizer/instructions.md

  - id: example-deploy-vercel
    name: "Deploy a Vercel"
    description: "Despliega un proyecto estático o Next.js a Vercel usando CLI o MCP. Incluye configuración de vercel.json, manejo de env vars y verificación del deploy."
    pattern: sequential-workflow
    category: workflow-automation
    tags: [deploy, vercel, frontend, static]
    instructions: skills/example-deploy-vercel/instructions.md
    files: skills/example-deploy-vercel/files/

# ──────────────────────────────────────────────
# CÓMO AGREGAR UN SKILL NUEVO
# ──────────────────────────────────────────────
# 1. Agrega una entrada aquí (id, name, description, pattern, tags, instructions, files)
# 2. Elige el patrón que mejor describe el comportamiento (ver skills/patterns.yaml)
# 3. Crea la carpeta: skills/<id>/
# 4. Escribe el workflow en: skills/<id>/instructions.md
# 5. Pon scripts/templates en: skills/<id>/files/
