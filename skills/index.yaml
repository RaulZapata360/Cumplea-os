    description: "Genera diagramas técnicos (flujos, secuencias, entidades, clases) con sintaxis Mermaid. Evalúa cuándo Mermaid es suficiente vs cuándo escalar a SVG crudo. Activa cuando necesites un diagrama de arquitectura, flujo de proceso, modelo de datos o secuencia de comunicación. Triggers: 'crea un diagrama', 'flowchart', 'diagrama de secuencia', 'modelo entidad-relación', 'arquitectura del sistema'."
