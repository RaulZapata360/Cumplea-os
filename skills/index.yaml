# SKILLS INDEX — Nivel 1 (siempre en contexto)
# Lee solo este archivo primero.
# Si un skill parece relevante → carga instructions.md
# Si necesitas más detalle → carga la carpeta files/
#
# Patrones disponibles (ver skills/patterns.yaml):
#   sequential-workflow | multi-mcp-coordination | iterative-refinement
#   context-aware-branching | domain-intelligence
#
# Categorías disponibles (ver skills/categories.yaml):
#   document-creation | workflow-automation | mcp-enhancement

skills:

  - id: linkedin-post-generator
    name: "LinkedIn Post Generator"
    description: "Redacta posts de LinkedIn de alto engagement usando patrones probados: hooks de historia personal, formato demo, pain points relacionables. Incluye checklist pre-publicación y anti-patrones a evitar."
    pattern: sequential-workflow
    category: document-creation
    tags: [linkedin, social-media, copywriting, contenido, engagement, posts]
    instructions: skills/linkedin-post-generator/instructions.md

  - id: ab-copy-variants-generator
    name: "A/B Copy Variants Generator"
    description: "Genera 5 variantes de copy testables para cualquier elemento de marketing (subject lines, headlines, CTAs, ads). Cada variante prueba un lever distinto con hipótesis falsificable. Incluye sample size y apuesta ganadora."
    pattern: sequential-workflow
    category: document-creation
    tags: [marketing, copywriting, ab-testing, conversion, email, ads, cta]
    instructions: skills/ab-copy-variants-generator/instructions.md

  - id: hook-engineer
    name: "Hook Engineer"
    description: "Genera 10 hooks scroll-stopping para LinkedIn, email, blog o ads. Cada hook usa un mecanismo psicológico distinto. Puntúa todos y marca los top 3 con justificación."
    pattern: sequential-workflow
    category: document-creation
    tags: [marketing, copywriting, hooks, linkedin, email, contenido, atención]
    instructions: skills/hook-engineer/instructions.md

  - id: seo-intent-analyzer
    name: "SEO Intent Analyzer"
    description: "Analiza el search intent de cualquier keyword y produce un content brief completo: tipo de contenido, formato, ángulo, outline H1/H2/H3 y keywords semánticas alineadas con lo que Google premia."
    pattern: sequential-workflow
    category: document-creation
    tags: [seo, keywords, content-brief, search-intent, serp, outline]
    instructions: skills/seo-intent-analyzer/instructions.md

  - id: content-optimizer
    name: "Content Optimizer"
    description: "Audita y optimiza cualquier contenido para SEO on-page. Verifica keyword density, meta tags, estructura de headings y legibilidad. Entrega: audit con severidad + correcciones + checklist completa."
    pattern: sequential-workflow
    category: document-creation
    tags: [seo, on-page, meta-tags, headings, readability, keyword, audit]
    instructions: skills/content-optimizer/instructions.md

  - id: csv-to-presentations
    name: "CSV to Presentations"
    description: "Convierte datos tabulares (CSV/Excel) en presentaciones PowerPoint profesionales con tablas y gráficas usando Python/python-pptx. Ideal para reportes trimestrales y executive summaries."
    pattern: sequential-workflow
    category: document-creation
    tags: [python, pptx, powerpoint, datos, reportes, gráficas, csv, excel]
    instructions: skills/csv-to-presentations/instructions.md

  - id: career-ladder-builder
